name: flowledger

services:
  app:
    build: .
    init: true
    environment:
      HTTP_HOST: 0.0.0.0
      PORT: "8090"
      WALLET_DIR: /data/wallet
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
    ports:
      - "127.0.0.1:${PORT:-8090}:8090"
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
      - go_build:/go/build-cache
      - wallet_data:/data/wallet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s

volumes:
  wallet_data:
  go_modules:
  go_build:
